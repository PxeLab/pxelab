global:
  data_dir: ~/.pxelab
  app_mode: false

interfaces:
  - name: eth0
    ip: 0.0.0.0
    dhcp: hybrid
    tftp: true
    http: true
    dns: false
    subnets:
      - cidr: 192.168.1.0/24
        pool: 192.168.1.100-200
        gateway: 192.168.1.1
        dns_servers: 8.8.8.8
        next_server: 192.168.1.10
        lease_time: 3600

boot:
  root_dir: /etc/pxelab/boot

auth:
  token: ""

store:
  dsn: pxelab.db

log:
  level: info
  format: text
