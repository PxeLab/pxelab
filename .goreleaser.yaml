version: 2

before:
  hooks:
    - cmd: npm ci
      dir: web
    - cmd: npm run build
      dir: web
    - cmd: sh scripts/update-version-json.sh

builds:
  - id: pxelab
    main: ./cmd/pxelab
    binary: pxelab
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    tags:
      - netgo
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - contrib/config.example.yaml
      - contrib/pxelab.service
      - contrib/com.pxelab.plist

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Maintenance
      regexp: '^chore(\(.+\))?:'
      order: 2
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: true
  prerelease: auto
