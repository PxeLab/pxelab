version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - cd web && npm ci && npm run build

builds:
  - id: pxelab
    main: ./cmd/pxelab
    binary: pxelab
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    tags:
      - netgo
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - contrib/config.example.yaml
      - contrib/pxelab.service
      - contrib/com.pxelab.plist

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  name_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Maintenance
      regexp: '^chore(\(.+\))?:'
      order: 2
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: pxelab
    name: pxelab
  draft: true
  prerelease: auto

nfpms:
  - id: packages
    package_name: pxelab
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: PxeLab
    homepage: https://github.com/pxelab/pxelab
    maintainer: PxeLab Team
    description: All-in-one PXE server (DHCP/TFTP/DNS/HTTP)
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: contrib/pxelab.service
        dst: /etc/systemd/system/pxelab.service
        type: config
      - src: contrib/config.example.yaml
        dst: /etc/pxelab/config.yaml
        type: config
    scripts:
      postinstall: contrib/postinstall.sh

brews:
  - name: pxelab
    repository:
      owner: pxelab
      name: homebrew-tap
    homepage: https://github.com/pxelab/pxelab
    description: All-in-one PXE server
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@pxelab.com
    install: |
      bin.install "pxelab"
      (etc/"pxelab").install "contrib/config.example.yaml"
    service: |
      run [opt_bin/"pxelab"]
      keep_alive true
      run_at_load true
