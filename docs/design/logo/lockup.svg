<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64">
  <!-- PxeLab lockup: "Stream" mark + Archivo wordmark, all ocean so it reads on
       both light and dark README backgrounds.
       NOTE: external fonts do not load in GitHub README rendering;
       the wordmark degrades to system sans-serif there (acceptable fallback). -->
  <g fill="#3B82F6">
    <rect x="8" y="8" width="9" height="9"/>
    <rect x="16" y="16" width="9" height="9"/>
    <rect x="24" y="24" width="9" height="9"/>
    <rect x="16" y="32" width="9" height="9"/>
    <rect x="8" y="40" width="9" height="9"/>
    <rect x="38" y="42" width="18" height="10"/>
  </g>
  <text x="72" y="43" font-family="Archivo, sans-serif" font-weight="600" font-size="36" letter-spacing="0.5" fill="#3B82F6">PxeLab</text>
</svg>
