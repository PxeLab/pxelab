<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PxeLab mark "Stream": a chevron ">" built from 5 pixel packets (9x9, 8-step diagonal)
       streaming toward the cursor block — the OS image flowing over the network into the
       bare-metal machine waiting at the boot prompt. Single color: currentColor. -->
  <g fill="currentColor">
    <rect x="8" y="8" width="9" height="9"/>
    <rect x="16" y="16" width="9" height="9"/>
    <rect x="24" y="24" width="9" height="9"/>
    <rect x="16" y="32" width="9" height="9"/>
    <rect x="8" y="40" width="9" height="9"/>
    <rect x="38" y="42" width="18" height="10"/>
  </g>
</svg>
