<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PxeLab logo — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0e111a;color:#edf0f7;font-family:'Archivo',sans-serif;padding:48px 56px}
  h2{font-size:15px;font-weight:600;margin:32px 0 16px}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b93a7}
  .row{display:flex;gap:32px;align-items:flex-end}
  .cell{text-align:center}
  .cell span{display:block;margin-top:8px}
  .checker{background:repeating-conic-gradient(#161b29 0% 25%, #10141f 0% 50%) 0 0/16px 16px;
           border:1px solid #1c2233;border-radius:8px;padding:20px;display:inline-block}
  /* AppShell replica: white mark on ocean tile */
  .tile9{width:36px;height:36px;border-radius:12px;background:#3B82F6;display:flex;align-items:center;justify-content:center;color:#fff}
  .tile9 svg{width:20px;height:20px}
  .tile16{width:64px;height:64px;border-radius:16px;background:#3B82F6;display:flex;align-items:center;justify-content:center;color:#fff}
  .tile16 svg{width:36px;height:36px}
  .iconmac{width:128px;height:128px;border-radius:22.37%;overflow:hidden}
  .iconmac img{width:100%;height:100%;display:block}
  .light{background:#f4f6fb;border-radius:10px;padding:20px 28px}
</style>
</head>
<body>
  <h2>mark.svg — currentColor on dark (inline, as used in code)</h2>
  <div class="row">
    <div class="cell"><svg width="160" height="160" viewBox="0 0 64 64" fill="currentColor" style="color:#3B82F6"><rect x="8" y="8" width="9" height="9"/><rect x="16" y="16" width="9" height="9"/><rect x="24" y="24" width="9" height="9"/><rect x="16" y="32" width="9" height="9"/><rect x="8" y="40" width="9" height="9"/><rect x="38" y="42" width="18" height="10"/></svg><span class="mono">160px · ocean</span></div>
    <div class="cell"><svg width="160" height="160" viewBox="0 0 64 64" fill="currentColor" style="color:#edf0f7"><rect x="8" y="8" width="9" height="9"/><rect x="16" y="16" width="9" height="9"/><rect x="24" y="24" width="9" height="9"/><rect x="16" y="32" width="9" height="9"/><rect x="8" y="40" width="9" height="9"/><rect x="38" y="42" width="18" height="10"/></svg><span class="mono">160px · fg</span></div>
  </div>

  <h2>AppShell / Login replica — white mark on ocean tile</h2>
  <div class="row">
    <div class="cell"><div class="tile9"><svg viewBox="0 0 64 64" fill="currentColor"><rect x="8" y="8" width="9" height="9"/><rect x="16" y="16" width="9" height="9"/><rect x="24" y="24" width="9" height="9"/><rect x="16" y="32" width="9" height="9"/><rect x="8" y="40" width="9" height="9"/><rect x="38" y="42" width="18" height="10"/></svg></div><span class="mono">AppShell 36px slot</span></div>
    <div class="cell"><div class="tile16"><svg viewBox="0 0 64 64" fill="currentColor"><rect x="8" y="8" width="9" height="9"/><rect x="16" y="16" width="9" height="9"/><rect x="24" y="24" width="9" height="9"/><rect x="16" y="32" width="9" height="9"/><rect x="8" y="40" width="9" height="9"/><rect x="38" y="42" width="18" height="10"/></svg></div><span class="mono">Login 64px slot</span></div>
    <div class="cell"><div class="iconmac"><img src="icon.svg" alt="icon"></div><span class="mono">icon.svg · macOS mask</span></div>
  </div>

  <h2>favicon.svg — real pixels</h2>
  <div class="checker">
    <div class="row">
      <div class="cell"><img src="favicon.svg" width="16" height="16"><span class="mono">16 px</span></div>
      <div class="cell"><img src="favicon.svg" width="32" height="32"><span class="mono">32 px</span></div>
      <div class="cell"><img src="favicon.svg" width="48" height="48"><span class="mono">48 px</span></div>
    </div>
  </div>

  <h2>lockup.svg — dark / light</h2>
  <div class="row" style="align-items:center">
    <div class="cell" style="background:#080a10;border:1px solid #1c2233;border-radius:10px;padding:20px 28px"><img src="lockup.svg" width="320"><span class="mono">dark</span></div>
    <div class="cell light"><img src="lockup.svg" width="320"><span class="mono">light</span></div>
  </div>
</body>
</html>
