<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- PxeLab "Push" mark: server pixel (accent) streams the OS image left-to-right to the rack -->
  <!-- left column: server side, full weight -->
  <rect x="4"  y="4"  width="24" height="24" rx="5" fill="#3b82f6"/>
  <rect x="4"  y="36" width="24" height="24" rx="5" fill="currentColor"/>
  <rect x="4"  y="68" width="24" height="24" rx="5" fill="currentColor"/>
  <!-- middle column: image in transit -->
  <rect x="40" y="8"  width="16" height="16" rx="4" fill="currentColor"/>
  <rect x="40" y="40" width="16" height="16" rx="4" fill="currentColor"/>
  <rect x="40" y="72" width="16" height="16" rx="4" fill="currentColor"/>
  <!-- right column: clients receiving -->
  <rect x="75.5" y="11.5" width="9" height="9" rx="2.5" fill="currentColor"/>
  <rect x="75.5" y="43.5" width="9" height="9" rx="2.5" fill="currentColor"/>
  <rect x="75.5" y="75.5" width="9" height="9" rx="2.5" fill="currentColor"/>
</svg>
