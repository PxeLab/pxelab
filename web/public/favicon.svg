<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PxeLab favicon: "Stream" mark, fixed ocean. Geometry is identical to mark.svg —
       the 9px packets on the 64 grid render ~2.25px at 16px and stay legible,
       verified against real-pixel screenshots (design-demos/logo-designer/showcase-v2). -->
  <g fill="#3B82F6">
    <rect x="8" y="8" width="9" height="9"/>
    <rect x="16" y="16" width="9" height="9"/>
    <rect x="24" y="24" width="9" height="9"/>
    <rect x="16" y="32" width="9" height="9"/>
    <rect x="8" y="40" width="9" height="9"/>
    <rect x="38" y="42" width="18" height="10"/>
  </g>
</svg>
