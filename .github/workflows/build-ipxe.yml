# PxeLab iPXE Build Workflow
# Builds both embedded (failsafe) and non-embedded (default) iPXE binaries
# Non-embedded relies on DHCP Option 175 + autoexec.ipxe
# Embedded has the script compiled in for maximum reliability
# Triggered by: push to boot/embedd.ipxe or boot/autoexec.ipxe, workflow_dispatch

name: Build iPXE

on:
  push:
    paths:
      - 'boot/embedd.ipxe'
      - 'boot/autoexec.ipxe'
    branches: [main]
  workflow_dispatch:

env:
  IPXE_VERSION: "v2.0.0"

jobs:
  # ── Non-embedded builds (default — relies on DHCP Option 175 + autoexec.ipxe) ──

  bios:
    name: BIOS / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ipxe/ipxe-builder-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i386
            bindir: bin
          - arch: x86_64
            bindir: bin-x86_64-pcbios
    steps:
      - name: Checkout PxeLab
        uses: actions/checkout@v4

      - name: Checkout iPXE
        uses: actions/checkout@v4
        with:
          repository: ipxe/ipxe
          ref: ${{ env.IPXE_VERSION }}
          path: ipxe-src

      - name: Build BIOS (non-embedded)
        working-directory: ipxe-src/src
        run: |
          make ${{ matrix.bindir }}/ipxe.pxe \
               ${{ matrix.bindir }}/undionly.kpxe

      - name: Copy artifacts
        run: |
          mkdir -p output
          cp ipxe-src/src/${{ matrix.bindir }}/ipxe.pxe output/ipxe-${{ matrix.arch }}.pxe
          cp ipxe-src/src/${{ matrix.bindir }}/undionly.kpxe output/undionly-${{ matrix.arch }}.kpxe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bios-${{ matrix.arch }}
          path: output/*

  uefi:
    name: UEFI / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ipxe/ipxe-builder-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm32
            efi_arch: arm32
          - arch: arm64
            efi_arch: arm64
          - arch: i386
            efi_arch: i386
          - arch: loong64
            efi_arch: loong64
          - arch: riscv32
            efi_arch: riscv32
          - arch: riscv64
            efi_arch: riscv64
          - arch: x86_64
            efi_arch: x86_64
    steps:
      - name: Checkout PxeLab
        uses: actions/checkout@v4

      - name: Checkout iPXE
        uses: actions/checkout@v4
        with:
          repository: ipxe/ipxe
          ref: ${{ env.IPXE_VERSION }}
          path: ipxe-src

      - name: Build UEFI (non-embedded)
        working-directory: ipxe-src/src
        run: |
          make bin-${{ matrix.efi_arch }}-efi/ipxe.efi \
               bin-${{ matrix.efi_arch }}-efi/snponly.efi

      - name: Copy artifacts
        run: |
          mkdir -p output
          cp ipxe-src/src/bin-${{ matrix.efi_arch }}-efi/ipxe.efi output/ipxe-${{ matrix.arch }}.efi
          cp ipxe-src/src/bin-${{ matrix.efi_arch }}-efi/snponly.efi output/snponly-${{ matrix.arch }}.efi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-${{ matrix.arch }}
          path: output/*

  # ── Embedded builds (failsafe — script compiled into binary) ──

  bios-embed:
    name: BIOS-embed / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ipxe/ipxe-builder-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i386
            bindir: bin
          - arch: x86_64
            bindir: bin-x86_64-pcbios
    steps:
      - name: Checkout PxeLab
        uses: actions/checkout@v4

      - name: Checkout iPXE
        uses: actions/checkout@v4
        with:
          repository: ipxe/ipxe
          ref: ${{ env.IPXE_VERSION }}
          path: ipxe-src

      - name: Build BIOS (embedded)
        working-directory: ipxe-src/src
        run: |
          make EMBED=../../boot/embedd.ipxe \
               ${{ matrix.bindir }}/ipxe.pxe \
               ${{ matrix.bindir }}/undionly.kpxe

      - name: Copy artifacts
        run: |
          mkdir -p output
          cp ipxe-src/src/${{ matrix.bindir }}/ipxe.pxe output/ipxe-${{ matrix.arch }}.pxe
          cp ipxe-src/src/${{ matrix.bindir }}/undionly.kpxe output/undionly-${{ matrix.arch }}.kpxe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bios-embed-${{ matrix.arch }}
          path: output/*

  uefi-embed:
    name: UEFI-embed / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ipxe/ipxe-builder-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm32
            efi_arch: arm32
          - arch: arm64
            efi_arch: arm64
          - arch: i386
            efi_arch: i386
          - arch: loong64
            efi_arch: loong64
          - arch: riscv32
            efi_arch: riscv32
          - arch: riscv64
            efi_arch: riscv64
          - arch: x86_64
            efi_arch: x86_64
    steps:
      - name: Checkout PxeLab
        uses: actions/checkout@v4

      - name: Checkout iPXE
        uses: actions/checkout@v4
        with:
          repository: ipxe/ipxe
          ref: ${{ env.IPXE_VERSION }}
          path: ipxe-src

      - name: Build UEFI (embedded)
        working-directory: ipxe-src/src
        run: |
          make EMBED=../../boot/embedd.ipxe \
               bin-${{ matrix.efi_arch }}-efi/ipxe.efi \
               bin-${{ matrix.efi_arch }}-efi/snponly.efi

      - name: Copy artifacts
        run: |
          mkdir -p output
          cp ipxe-src/src/bin-${{ matrix.efi_arch }}-efi/ipxe.efi output/ipxe-${{ matrix.arch }}.efi
          cp ipxe-src/src/bin-${{ matrix.efi_arch }}-efi/snponly.efi output/snponly-${{ matrix.arch }}.efi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-embed-${{ matrix.arch }}
          path: output/*

  # ── Combine all artifacts ──

  combine:
    name: Combine artifacts
    runs-on: ubuntu-latest
    needs: [bios, uefi, bios-embed, uefi-embed]
    steps:
      - name: Download non-embedded artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bios-*|uefi-*
          merge-multiple: false

      - name: Download embedded artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-embed
          pattern: *-embed-*
          merge-multiple: false

      - name: Organize output
        run: |
          # Non-embedded (default)
          mkdir -p pxelab-ipxe
          find artifacts -name '*.pxe' ! -name '*embed*' -exec cp {} pxelab-ipxe/ \;
          find artifacts -name '*.kpxe' ! -name '*embed*' -exec cp {} pxelab-ipxe/ \;
          find artifacts -name '*.efi' ! -name '*embed*' -exec cp {} pxelab-ipxe/ \;

          # Embedded (failsafe)
          mkdir -p pxelab-ipxe-embed
          find artifacts-embed -name '*.pxe' -exec cp {} pxelab-ipxe-embed/ \;
          find artifacts-embed -name '*.kpxe' -exec cp {} pxelab-ipxe-embed/ \;
          find artifacts-embed -name '*.efi' -exec cp {} pxelab-ipxe-embed/ \;

          echo "=== Non-embedded (default) ==="
          ls -la pxelab-ipxe/
          echo ""
          echo "=== Embedded (failsafe) ==="
          ls -la pxelab-ipxe-embed/

      - name: Upload non-embedded
        uses: actions/upload-artifact@v4
        with:
          name: pxelab-ipxe
          path: pxelab-ipxe/

      - name: Upload embedded
        uses: actions/upload-artifact@v4
        with:
          name: pxelab-ipxe-embed
          path: pxelab-ipxe-embed/

  # ── Update boot/ directory (manual trigger only) ──

  update-boot:
    name: Update boot/ directory
    runs-on: ubuntu-latest
    needs: [combine]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout PxeLab
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download non-embedded
        uses: actions/download-artifact@v4
        with:
          name: pxelab-ipxe
          path: pxelab-ipxe

      - name: Download embedded
        uses: actions/download-artifact@v4
        with:
          name: pxelab-ipxe-embed
          path: pxelab-ipxe-embed

      - name: Copy to boot/ (non-embedded = default)
        run: |
          # BIOS
          cp pxelab-ipxe/undionly-i386.kpxe boot/undionly.kpxe
          cp pxelab-ipxe/ipxe-x86_64.pxe boot/ipxe.pxe
          # UEFI
          cp pxelab-ipxe/ipxe-arm32.efi boot/ipxe-arm32.efi
          cp pxelab-ipxe/ipxe-arm64.efi boot/ipxe-arm64.efi
          cp pxelab-ipxe/ipxe-i386.efi boot/ipxe32.efi
          cp pxelab-ipxe/ipxe-loong64.efi boot/ipxe-loong64.efi
          cp pxelab-ipxe/ipxe-riscv32.efi boot/ipxe-riscv32.efi
          cp pxelab-ipxe/ipxe-riscv64.efi boot/ipxe-riscv64.efi
          cp pxelab-ipxe/ipxe-x86_64.efi boot/ipxe.efi
          # snponly variants
          cp pxelab-ipxe/snponly-arm32.efi boot/snponly-arm32.efi
          cp pxelab-ipxe/snponly-arm64.efi boot/snponly-arm64.efi
          cp pxelab-ipxe/snponly-i386.efi boot/snponly-i386.efi 2>/dev/null || true
          cp pxelab-ipxe/snponly-loong64.efi boot/snponly-loong64.efi
          cp pxelab-ipxe/snponly-riscv32.efi boot/snponly-riscv32.efi
          cp pxelab-ipxe/snponly-riscv64.efi boot/snponly-riscv64.efi
          cp pxelab-ipxe/snponly-x86_64.efi boot/ipxe-snponly.efi
          echo "=== Updated boot/ (non-embedded) ==="

      - name: Copy to boot/embed/ (embedded = failsafe)
        run: |
          mkdir -p boot/embed
          # BIOS
          cp pxelab-ipxe-embed/undionly-i386.kpxe boot/embed/undionly.kpxe
          cp pxelab-ipxe-embed/ipxe-x86_64.pxe boot/embed/ipxe.pxe
          # UEFI
          cp pxelab-ipxe-embed/ipxe-arm32.efi boot/embed/ipxe-arm32.efi
          cp pxelab-ipxe-embed/ipxe-arm64.efi boot/embed/ipxe-arm64.efi
          cp pxelab-ipxe-embed/ipxe-i386.efi boot/embed/ipxe32.efi
          cp pxelab-ipxe-embed/ipxe-loong64.efi boot/embed/ipxe-loong64.efi
          cp pxelab-ipxe-embed/ipxe-riscv32.efi boot/embed/ipxe-riscv32.efi
          cp pxelab-ipxe-embed/ipxe-riscv64.efi boot/embed/ipxe-riscv64.efi
          cp pxelab-ipxe-embed/ipxe-x86_64.efi boot/embed/ipxe.efi
          # snponly variants
          cp pxelab-ipxe-embed/snponly-arm32.efi boot/embed/snponly-arm32.efi
          cp pxelab-ipxe-embed/snponly-arm64.efi boot/embed/snponly-arm64.efi
          cp pxelab-ipxe-embed/snponly-i386.efi boot/embed/snponly-i386.efi 2>/dev/null || true
          cp pxelab-ipxe-embed/snponly-loong64.efi boot/embed/snponly-loong64.efi
          cp pxelab-ipxe-embed/snponly-riscv32.efi boot/embed/snponly-riscv32.efi
          cp pxelab-ipxe-embed/snponly-riscv64.efi boot/embed/snponly-riscv64.efi
          cp pxelab-ipxe-embed/snponly-x86_64.efi boot/embed/ipxe-snponly.efi
          echo "=== Updated boot/embed/ (embedded) ==="

      - name: Show final layout
        run: |
          echo "=== boot/ (non-embedded, default) ==="
          ls -la boot/*.efi boot/*.pxe boot/*.kpxe 2>/dev/null
          echo ""
          echo "=== boot/embed/ (embedded, failsafe) ==="
          ls -la boot/embed/*.efi boot/embed/*.pxe boot/embed/*.kpxe 2>/dev/null
          echo ""
          echo "=== boot scripts ==="
          ls -la boot/autoexec.ipxe boot/embedd.ipxe

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boot/
          git diff --cached --quiet || git commit -m "ci: update iPXE binaries (non-embedded + embedded) [skip ci]"
          git push
